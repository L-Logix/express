<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Walter Dog's Game Spot - Error">
<meta name="theme-color" content="#07070f">
<title>Error - Walter Dog's Game Spot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Exo+2:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Exo 2',sans-serif;background:#07070f;color:#e8e8ff;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
.error-container{position:relative;z-index:1;text-align:center;max-width:700px;padding:3rem 2rem}
.error-code{font-family:'Orbitron',monospace;font-weight:900;font-size:clamp(5rem,15vw,12rem);line-height:1;position:relative}
.error-code span{display:inline-block;animation:glitch 3s ease-in-out infinite}
.error-code .c1{color:#00f0ff;text-shadow:0 0 40px rgba(0,240,255,0.4),0 0 80px rgba(0,240,255,0.1)}
.error-code .c2{color:#ff00aa;text-shadow:0 0 40px rgba(255,0,170,0.4),0 0 80px rgba(255,0,170,0.1)}
.error-code .c3{color:#7b2ffc;text-shadow:0 0 40px rgba(123,47,252,0.4),0 0 80px rgba(123,47,252,0.1)}
.error-code .glitch-line{position:absolute;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,240,255,0.03) 2px,rgba(0,240,255,0.03) 4px);pointer-events:none}
.error-title{font-family:'Orbitron',monospace;font-weight:700;font-size:clamp(1.2rem,2.5vw,1.8rem);margin:1.5rem 0 0.8rem;letter-spacing:0.1em}
.error-message{font-family:'Rajdhani',sans-serif;font-size:1.1rem;color:#8888bb;line-height:1.8;margin-bottom:2rem;max-width:500px;margin-left:auto;margin-right:auto}
.error-category{display:inline-flex;align-items:center;gap:8px;padding:8px 20px;background:rgba(0,240,255,0.08);border:1px solid rgba(0,240,255,0.2);border-radius:25px;font-family:'Rajdhani',sans-serif;font-weight:600;font-size:0.85rem;color:#00f0ff;text-transform:uppercase;letter-spacing:0.15em;margin-bottom:1.5rem}
.error-category .dot{width:8px;height:8px;border-radius:50%;animation:pulse 1.5s ease-in-out infinite}
.error-actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.btn{padding:14px 36px;border-radius:30px;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:0.95rem;text-transform:uppercase;letter-spacing:0.1em;cursor:pointer;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);text-decoration:none;display:inline-flex;align-items:center;gap:10px;border:none}
.btn-primary{background:linear-gradient(135deg,#00f0ff,#7b2ffc);color:#07070f;box-shadow:0 0 30px rgba(0,240,255,0.3)}
.btn-primary:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 0 50px rgba(0,240,255,0.5)}
.btn-secondary{background:transparent;border:1px solid rgba(0,240,255,0.3);color:#00f0ff}
.btn-secondary:hover{background:rgba(0,240,255,0.1);box-shadow:0 0 15px rgba(0,240,255,0.4)}
.error-details{font-family:'Rajdhani',sans-serif;font-size:0.8rem;color:#555577;margin-top:2rem;padding-top:1.5rem;border-top:1px solid rgba(255,255,255,0.05)}
.error-details a{color:#00f0ff;text-decoration:none}
.error-details a:hover{text-decoration:underline}
@keyframes glitch{0%,100%{transform:translate(0)}20%{transform:translate(-2px,2px)}40%{transform:translate(2px,-2px)}60%{transform:translate(-1px,-1px)}80%{transform:translate(1px,1px)}}
@keyframes pulse{0%,100%{opacity:0.6;box-shadow:0 0 10px currentColor}50%{opacity:1;box-shadow:0 0 20px currentColor}}
.spinner-small{width:16px;height:16px;border:2px solid rgba(0,240,255,0.1);border-top-color:#00f0ff;border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:480px){.error-container{padding:2rem 1rem}.error-actions{flex-direction:column}.btn{justify-content:center}}
</style>
</head>
<body>
<canvas id="errorCanvas"></canvas>
<div class="error-container">
  <div class="error-code" id="errorCode">
    <span class="c1" id="digit1">4</span>
    <span class="c2" id="digit2">0</span>
    <span class="c3" id="digit3">4</span>
    <div class="glitch-line"></div>
  </div>
  <div class="error-category"><span class="dot" id="categoryDot" style="background:#00f0ff;box-shadow:0 0 10px #00f0ff"></span><span id="errorCategory">CLIENT ERROR</span></div>
  <h1 class="error-title" id="errorTitle">PAGE NOT FOUND</h1>
  <p class="error-message" id="errorMessage">The requested resource could not be found on this server. It may have been moved, deleted, or never existed.</p>
  <div class="error-actions">
    <a href="index.html" class="btn btn-primary"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Back to Home</a>
    <button class="btn btn-secondary" onclick="history.back()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>Go Back</button>
  </div>
  <div class="error-details">
    <span style="display:inline-flex;align-items:center;gap:6px"><span class="spinner-small"></span> Walter Dog's Game Spot &middot; Powered by Express Airways</span><br>
    <a href="index.html">Return to homepage</a> &middot; <a href="pages/leaderboard.html">Leaderboards</a> &middot; <a href="pages/profile.html">Profile</a>
  </div>
</div>
<script>
(function(){
  var canvas = document.getElementById('errorCanvas');
  var ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  var particles = [];
  var count = Math.min(60, Math.floor(window.innerWidth / 20));
  for (var i = 0; i < count; i++) {
    particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4, size: Math.random() * 2 + 0.5, opacity: Math.random() * 0.4 + 0.1, hue: Math.random() > 0.5 ? 180 : 280 });
  }
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = canvas.width;
      if (p.x > canvas.width) p.x = 0;
      if (p.y < 0) p.y = canvas.height;
      if (p.y > canvas.height) p.y = 0;
      ctx.fillStyle = 'hsla(' + p.hue + ', 100%, 50%, ' + p.opacity + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    requestAnimationFrame(animate);
  }
  animate();
  window.addEventListener('resize', function() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

  var params = new URLSearchParams(window.location.search);
  var code = params.get('code') || params.get('c') || '404';
  var message = params.get('message') || params.get('msg') || '';
  var codeNum = parseInt(code, 10);
  if (isNaN(codeNum) || codeNum < 100 || codeNum > 599) codeNum = 404;

  var digits = String(codeNum).padStart(3, '0');
  document.getElementById('digit1').textContent = digits[0];
  document.getElementById('digit2').textContent = digits[1];
  document.getElementById('digit3').textContent = digits[2];

  var categories = {
    '1': { name: 'INFORMATIONAL', color: '#00ff88', title: 'INFORMATIONAL RESPONSE', desc: 'The server has received your request and is processing it. This is an interim response.' },
    '2': { name: 'SUCCESS', color: '#00ff88', title: 'SUCCESS', desc: 'The request was successful. This status code is not typically displayed as an error.' },
    '3': { name: 'REDIRECTION', color: '#ffcc00', title: 'REDIRECTION', desc: 'The requested resource has moved to a different location. You are being redirected.' },
    '4': { name: 'CLIENT ERROR', color: '#ff3366', title: 'CLIENT ERROR', desc: 'The request could not be understood or was missing required parameters.' },
    '5': { name: 'SERVER ERROR', color: '#ff00aa', title: 'SERVER ERROR', desc: 'The server encountered an unexpected condition that prevented it from fulfilling the request.' },
  };

  var cat = categories[digits[0]] || categories['4'];
  var dot = document.getElementById('categoryDot');
  dot.style.background = cat.color;
  dot.style.boxShadow = '0 0 10px ' + cat.color;
  document.getElementById('errorCategory').textContent = cat.name;

  var titles = {};
  var messages = {};
  var statusTexts = {
    100: 'Continue', 101: 'Switching Protocols', 102: 'Processing', 103: 'Early Hints',
    200: 'OK', 201: 'Created', 202: 'Accepted', 203: 'Non-Authoritative Information', 204: 'No Content', 205: 'Reset Content', 206: 'Partial Content', 207: 'Multi-Status', 208: 'Already Reported', 226: 'IM Used',
    300: 'Multiple Choices', 301: 'Moved Permanently', 302: 'Found', 303: 'See Other', 304: 'Not Modified', 305: 'Use Proxy', 307: 'Temporary Redirect', 308: 'Permanent Redirect',
    400: 'Bad Request', 401: 'Unauthorized', 402: 'Payment Required', 403: 'Forbidden', 404: 'Not Found', 405: 'Method Not Allowed', 406: 'Not Acceptable', 407: 'Proxy Authentication Required', 408: 'Request Timeout', 409: 'Conflict', 410: 'Gone', 411: 'Length Required', 412: 'Precondition Failed', 413: 'Payload Too Large', 414: 'URI Too Long', 415: 'Unsupported Media Type', 416: 'Range Not Satisfiable', 417: 'Expectation Failed', 418: "I'm a Teapot", 421: 'Misdirected Request', 422: 'Unprocessable Entity', 423: 'Locked', 424: 'Failed Dependency', 425: 'Too Early', 426: 'Upgrade Required', 428: 'Precondition Required', 429: 'Too Many Requests', 431: 'Request Header Fields Too Large', 451: 'Unavailable For Legal Reasons',
    500: 'Internal Server Error', 501: 'Not Implemented', 502: 'Bad Gateway', 503: 'Service Unavailable', 504: 'Gateway Timeout', 505: 'HTTP Version Not Supported', 506: 'Variant Also Negotiates', 507: 'Insufficient Storage', 508: 'Loop Detected', 509: 'Bandwidth Limit Exceeded', 510: 'Not Extended', 511: 'Network Authentication Required'
  };
  var defaultMessages = {
    '1': 'Your request is being processed. Please wait for the final response.',
    '2': 'Everything is working correctly. No error here!',
    '3': 'The resource has moved. Please update your bookmarks.',
    '4': 'There was a problem with your request. Please check your input and try again.',
    '5': 'The server encountered an error. Please try again later.' + (codeNum === 503 ? ' The service may be temporarily overloaded or under maintenance.' : ''),
  };

  var titleText = statusTexts[codeNum] || cat.title;
  var descText = message || (statusTexts[codeNum] ? 'The server returned status code ' + codeNum + ' (' + statusTexts[codeNum] + '). ' + (defaultMessages[digits[0]] || '') : (defaultMessages[digits[0]] || 'An unexpected error occurred.'));

  document.getElementById('errorTitle').textContent = titleText;
  document.getElementById('errorMessage').textContent = descText;

  document.title = codeNum + ' ' + titleText + ' - Walter Dog\'s Game Spot';
})();
</script>
</body>
</html>
