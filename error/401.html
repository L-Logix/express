<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>401 - Express Airways</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --bg-primary: #080c1a; --bg-secondary: #0d1230; --text-primary: #f0f4ff; --text-secondary: #8892b0; --accent: #4f8cff; --accent-gradient: linear-gradient(135deg, #4f8cff, #00d4aa); --success: #00d4aa; --danger: #ef4444; --border: rgba(255,255,255,0.06); --radius-sm: 8px; --radius-md: 12px; --radius-lg: 20px; --nav-height: 72px; --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif; }
body { font-family: var(--font-sans); background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; }
.navbar { position: fixed; top: 0; left: 0; right: 0; height: var(--nav-height); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: rgba(8,12,26,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); z-index: 100; }
.nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
.nav-title { font-size: 18px; font-weight: 700; }
.hero { flex: 1; display: flex; align-items: center; justify-content: center; padding: var(--nav-height) 24px 40px; position: relative; overflow: hidden; }
.hero-gradient { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(79,140,255,0.12), transparent), radial-gradient(ellipse 60% 50% at 80% 100%, rgba(0,212,170,0.08), transparent); }
.hero-content { position: relative; z-index: 1; text-align: center; max-width: 700px; }
.error-code { font-size: clamp(80px, 15vw, 160px); font-weight: 800; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1.1; letter-spacing: -4px; margin-bottom: 8px; }
.error-title { font-size: clamp(24px, 4vw, 36px); font-weight: 700; margin-bottom: 16px; }
.error-desc { font-size: 16px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 32px; max-width: 500px; margin-left: auto; margin-right: auto; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; font-family: var(--font-sans); transition: 0.3s ease; }
.btn-primary { background: var(--accent-gradient); color: #fff; box-shadow: 0 0 20px rgba(79,140,255,0.3); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 0 30px rgba(79,140,255,0.4); }
.btn-outline { background: transparent; color: var(--text-primary); border: 1px solid var(--border); }
.btn-outline:hover { border-color: var(--accent); }
.actions { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.footer { border-top: 1px solid var(--border); padding: 24px; text-align: center; }
.footer p { font-size: 12px; color: #555d7a; }
.error-ref { margin-top: 16px; font-size: 13px; }
.error-ref a { color: var(--accent); text-decoration: none; }
@media (max-width: 768px) { :root { --nav-height: 60px; } .error-code { font-size: 72px; } }
</style>
</head>
<body>
<nav class="navbar">
  <a href="../index.html" class="nav-brand"><span class="nav-title">Express Airways</span></a>
</nav>
<section class="hero">
  <div class="hero-gradient"></div>
  <div class="hero-content">
    <div class="error-code">401</div>
    <h1 class="error-title">Unauthorized</h1>
    <p class="error-desc">Authentication is required to access this resource. Sign in to your Express Airways account and try again.</p>
    <div class="actions">
      <a href="../index.html" class="btn btn-primary">Return Home</a>
      <a href="index.html" class="btn btn-outline">View All Error Codes</a>
    </div>
    <div class="error-ref">Error Code: 401 | <a href="index.html">Error Code Reference</a></div>
  </div>
</section>
<footer class="footer"><p>&copy; 2026 Express Airways. All rights reserved.</p></footer>
</body>
</html>
